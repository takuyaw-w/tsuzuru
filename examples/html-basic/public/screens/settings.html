<div class="html-basic-screen__content html-basic-screen__content--panel">
  <h1 class="html-basic-screen__heading">Settings</h1>

  <div class="html-basic-settings">
    <label class="html-basic-settings__field">
      <span class="html-basic-settings__label">Text font size</span>
      <input
        type="range"
        class="html-basic-settings__control"
        aria-label="Text font size"
        min="0.95"
        max="1.35"
        step="0.05"
        data-tsuzuru-setting="textFontSize"
      />
      <span class="html-basic-settings__hint" data-tsuzuru-setting-output="textFontSize"></span>
    </label>

    <label class="html-basic-settings__field">
      <span class="html-basic-settings__label">Message window opacity</span>
      <input
        type="range"
        class="html-basic-settings__control"
        aria-label="Message window opacity"
        min="0.55"
        max="0.95"
        step="0.05"
        data-tsuzuru-setting="messageWindowOpacity"
      />
      <span class="html-basic-settings__hint" data-tsuzuru-setting-output="messageWindowOpacity"></span>
    </label>

    <label class="html-basic-settings__field">
      <span class="html-basic-settings__label">Audio notices</span>
      <input
        type="checkbox"
        class="html-basic-settings__control"
        aria-label="Audio notices"
        data-tsuzuru-setting="audioNoticesVisible"
      />
      <span class="html-basic-settings__hint" data-tsuzuru-setting-output="audioNoticesVisible"></span>
    </label>
  </div>

  <a class="html-basic-screen__button" href="#runtime">Back</a>
</div>
