<section class="html-basic-screen html-basic-screen--title" aria-label="Title">
  <div class="html-basic-title-art" aria-hidden="true">
    <span class="html-basic-title-art__sun"></span>
    <span class="html-basic-title-art__platform"></span>
    <span class="html-basic-title-art__rail html-basic-title-art__rail--front"></span>
    <span class="html-basic-title-art__rail html-basic-title-art__rail--back"></span>
  </div>

  <div class="html-basic-screen__content html-basic-screen__content--title">
    <div class="html-basic-title-copy">
      <p class="html-basic-screen__eyebrow">Tsuzuru</p>
      <h1 class="html-basic-screen__title">Tsuzuru HTML Basic</h1>
      <p class="html-basic-screen__subtitle">Preact なしで .tzr を再生する HTML adapter example。</p>
    </div>

    <div class="html-basic-title-menu">
      <div class="html-basic-screen__actions html-basic-screen__actions--primary">
        <button
          type="button"
          class="html-basic-screen__button html-basic-screen__button--primary"
          data-action="start"
        >
          Start
        </button>
        <button type="button" class="html-basic-screen__button" disabled>Continue</button>
      </div>

      <div class="html-basic-screen__actions html-basic-screen__actions--secondary">
        <button type="button" class="html-basic-screen__button" data-action="open-backlog">Backlog</button>
        <button type="button" class="html-basic-screen__button" data-action="open-settings">Settings</button>
        <button type="button" class="html-basic-screen__button" data-action="open-gallery">Gallery</button>
      </div>
    </div>
  </div>
</section>
