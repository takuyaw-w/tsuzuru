name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-fast:
    name: Quality Fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package inventory
        run: pnpm inventory:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Biome check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Check diff whitespace
        run: git diff --check

  quality-release-readiness:
    name: Quality Release Readiness
    runs-on: ubuntu-latest
    needs: quality-fast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check examples
        run: pnpm examples:check

      - name: Pack dry-run
        run: pnpm run pack:dry-run

      - name: Smoke create-tsuzuru
        run: pnpm run smoke:create-tsuzuru
