name: Examples E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  examples-e2e:
    name: Examples E2E Optional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm packages:build

      - name: Run examples E2E
        run: pnpm examples:e2e

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: examples-e2e-playwright-report
          path: |
            examples/preact-basic/playwright-report
            examples/preact-basic/test-results
            examples/preact-sound-novel/playwright-report
            examples/preact-sound-novel/test-results
            examples/preact-starter/playwright-report
            examples/preact-starter/test-results
